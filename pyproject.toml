[project]
name = "osrs-mcp"
version = "0.1.0"
description = "MCP server providing OSRS game data and player stats to Claude"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.scripts]
osrs-mcp = "osrs_mcp.server:main"

[dependency-groups]
dev = [
    "playwright>=1.58.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.22.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
